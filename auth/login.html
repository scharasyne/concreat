<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConCorp Learning - Login</title>
    <link rel="stylesheet" href="../shared/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: var(--shadow-hover);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .company-logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }

        .company-subtitle {
            color: var(--dark-gray);
            font-size: 1rem;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .role-option {
            border: 2px solid var(--medium-gray);
            border-radius: 8px;
            padding: 1.5rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: var(--white);
        }

        .role-option:hover {
            border-color: var(--secondary-blue);
            transform: translateY(-2px);
        }

        .role-option.selected {
            border-color: var(--primary-blue);
            background-color: var(--light-blue);
            color: var(--primary-blue);
        }

        .role-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .role-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .role-description {
            font-size: 0.8rem;
            color: var(--dark-gray);
        }

        .error-message {
            background-color: var(--error);
            color: var(--white);
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .forgot-password {
            text-align: center;
            margin-top: 1rem;
        }

        .forgot-password a {
            color: var(--secondary-blue);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="company-logo">ConCorp</div>
            <div class="company-subtitle">Learning Management System</div>
        </div>

        <div class="error-message" id="errorMessage">
            Invalid credentials. Please try again.
        </div>

        <form id="loginForm">
            <div class="role-selector">
                <div class="role-option" data-role="student">
                    <div class="role-icon">👨‍🎓</div>
                    <div class="role-title">Student</div>
                    <div class="role-description">Access courses and assignments</div>
                </div>
                <div class="role-option" data-role="admin">
                    <div class="role-icon">👨‍💼</div>
                    <div class="role-title">Administrator</div>
                    <div class="role-description">Manage courses and students</div>
                </div>
            </div>

            <div class="form-group">
                <label for="username" class="form-label">Username or Email</label>
                <input type="text" id="username" class="form-input" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-input" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
                Sign In
            </button>

            <div class="forgot-password">
                <a href="#">Forgot your password?</a>
            </div>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
